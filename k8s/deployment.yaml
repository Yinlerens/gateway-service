apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gateway-service
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: gateway-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: gateway-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-service
          image: ghcr.io/yinlerens/gateway-service@sha256:4ea5e643560b7eff4ad95666ffb37891b504982762ccf7bd96bf9197270667ae
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "15"
            - name: MAX_BODY_BYTES
              value: "4194304"
            - name: AUDIT_MAX_BODY_BYTES
              value: "4194304"
            - name: AUDIT_WRITE_TIMEOUT_SECONDS
              value: "3"
            - name: OTEL_SERVICE_NAME
              value: gateway-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=test,k8s.cluster.name=wuwa
            - name: UPSTREAM_ROUTES
              value: assets=/api/v1/assets|http://asset-service.asset-service.svc.cluster.local/v1,gacha=/api/v1/gacha|http://gacha-engine-service.gacha-engine-service.svc.cluster.local/v1,backpack=/api/v1/backpack|http://backpack-service.backpack-service.svc.cluster.local/v1
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: supabase-url
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: supabase-anon-key
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: internal-token
            - name: AUDIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: audit-database-url
            - name: AUDIT_LOG_ADMIN_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secrets
                  key: audit-log-admin-user-ids
                  optional: true
          startupProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              port: http
              path: /ready
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              port: http
              path: /health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
